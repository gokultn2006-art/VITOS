services:
  # 1. Django REST Backend API
  - type: web
    name: vitos-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/manage.py migrate --noinput && python backend/manage.py seed_data && python backend/manage.py collectstatic --noinput
    startCommand: gunicorn vitos_backend.wsgi:application --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # 2. React Vite Frontend
  - type: web
    name: vitos-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vitos-backend
          property: url
